<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirsini Artakianou</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
    }

    nav {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: black;
      font-size: 18px;
    }

    header {
      text-align: center;
      padding: 80px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }

    .cv {
      max-width: 800px;
      margin: auto;
      padding: 40px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<nav>
  <a href="#works">Works</a>
  <a href="#cv">CV</a>
</nav>

<header>
  <h1>Mirsini Artakianou</h1>
  <p>Artist</p>
</header>

<section id="works">
  <div class="gallery">

    <img src="https://picsum.photos/600/800?1">
    <img src="https://picsum.photos/600/800?2">
    <img src="https://picsum.photos/600/800?3">

  </div>
</section>

<section id="cv">
  <div class="cv">
    <h2>CV</h2>

    <p>
      Add your exhibitions, education, publications and projects here.
    </p>

  </div>
</section>

</body>
</html>
