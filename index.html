<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirsini Artakianou</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: white;
  color: black;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 40px;
  font-size: 14px;
  letter-spacing: 1px;
  border-bottom: 1px solid #eee;
}

.topbar a {
  text-decoration: none;
  color: black;
}

/* GALLERY (SHOWS IMMEDIATELY) */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  padding: 40px;
}

.gallery img {
  width: 100%;
  display: block;
}

/* CV / WORKSHOPS */
.page {
  display: none;
  padding: 40px;
  max-width: 800px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="topbar">
  <div>
    <a href="index.html">Mirsini Artakianou</a>
  </div>

  <div>
    <a href="#workshops">Workshops</a>
    <a href="#cv">CV</a>
  </div>
</div>

<!-- DEFAULT = WORKS SHOWN DIRECTLY -->
<div class="gallery">
  <img src="https://picsum.photos/800/1000?1">
  <img src="https://picsum.photos/800/1000?2">
  <img src="https://picsum.photos/800/1000?3">
  <img src="https://picsum.photos/800/1000?4">
</div>

<!-- OPTIONAL SECTIONS -->
<div id="workshops" class="page">
  <h2>Workshops</h2>
  <p>Add your workshops here.</p>
</div>

<div id="cv" class="page">
  <h2>CV</h2>
  <p>Add your CV here.</p>
</div>

</body>
</html>
