<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirsini Artakianou</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: white;
  color: black;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 40px;
  font-size: 14px;
  letter-spacing: 1px;
  border-bottom: 1px solid #eee;
}

/* LEFT NAME */
.name {
  font-weight: 400;
}

/* RIGHT MENU */
.menu a {
  margin-left: 25px;
  text-decoration: none;
  color: black;
}

/* WORKS GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  padding: 40px;
}

.gallery img {
  width: 100%;
  display: block;
}

/* SECTIONS */
section {
  display: none;
}

section.active {
  display: block;
}

/* CV */
.cv {
  max-width: 700px;
  margin: auto;
  padding: 40px;
  font-size: 14px;
  line-height: 1.8;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="topbar">
  <div class="name">
    <a href="#" onclick="showPage('works')" style="text-decoration:none; color:black;">
      Mirsini Artakianou
    </a>
  </div>

  <div class="menu">
    <a href="#" onclick="showPage('works')">Works</a>
    <a href="#" onclick="showPage('workshops')">Workshops</a>
    <a href="#" onclick="showPage('cv')">CV</a>
  </div>
</div>

<!-- WORKS (DEFAULT PAGE) -->
<section id="works" class="active">
  <div class="gallery">
    <img src="https://picsum.photos/800/1000?1">
    <img src="https://picsum.photos/800/1000?2">
    <img src="https://picsum.photos/800/1000?3">
    <img src="https://picsum.photos/800/1000?4">
  </div>
</section>

<!-- WORKSHOPS -->
<section id="workshops">
  <div class="cv">
    <h2>Workshops</h2>
    <p>Add your workshops here.</p>
  </div>
</section>

<!-- CV -->
<section id="cv">
  <div class="cv">
    <h2>CV</h2>

    <p><b>Education</b><br>
    Add here</p>

    <p><b>Exhibitions</b><br>
    Add here</p>

  </div>
</section>

<script>
function showPage(page) {
  document.querySelectorAll('section').forEach(s => {
    s.classList.remove('active');
  });
  document.getElementById(page).classList.add('active');
}
</script>

</body>
</html>
