<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirsini Artakianou</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: white;
  color: black;
}

/* TOP NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 25px 40px;
  font-size: 14px;
  letter-spacing: 1px;
  position: fixed;
  width: 100%;
  top: 0;
  background: white;
  border-bottom: 1px solid #eee;
}

nav a {
  text-decoration: none;
  color: black;
  margin-left: 20px;
}

/* SECTIONS */
section {
  display: none;
  padding: 120px 40px 60px 40px;
}

/* ACTIVE SECTION */
section.active {
  display: block;
}

/* WORKS GRID */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}

.gallery img {
  width: 100%;
}

/* CV */
.cv {
  max-width: 700px;
  font-size: 14px;
  line-height: 1.8;
}
</style>
</head>

<body>

<nav>
  <div>
    <a href="#" onclick="showPage('works')">Mirsini Artakianou</a>
  </div>

  <div>
    <a href="#" onclick="showPage('works')">Works</a>
    <a href="#" onclick="showPage('workshops')">Workshops</a>
    <a href="#" onclick="showPage('cv')">CV</a>
  </div>
</nav>

<!-- WORKS (HOME PAGE) -->
<section id="works" class="active">
  <div class="gallery">
    <img src="https://picsum.photos/800/1000?1">
    <img src="https://picsum.photos/800/1000?2">
    <img src="https://picsum.photos/800/1000?3">
    <img src="https://picsum.photos/800/1000?4">
  </div>
</section>

<!-- WORKSHOPS -->
<section id="workshops">
  <h2>Workshops</h2>
  <p>Add your workshops here.</p>
</section>

<!-- CV -->
<section id="cv">
  <div class="cv">
    <h2>CV</h2>

    <p><b>Education</b><br>
    Add here</p>

    <p><b>Exhibitions</b><br>
    Add here</p>
  </div>
</section>

<script>
function showPage(page) {
  document.querySelectorAll('section').forEach(s => {
    s.classList.remove('active');
  });

  document.getElementById(page).classList.add('active');
}
</script>

</body>
</html>
